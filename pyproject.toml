[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aop-platform"
version = "0.1.0"
description = "Application Onboarding Platform API MVP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.135.1",
  "pydantic>=2.12.5",
  "sqlalchemy>=2.0.37",
  "alembic>=1.14.1",
  "psycopg[binary]>=3.2.3",
  "PyJWT>=2.10.1",
  "bcrypt>=4.3.0",
  "python-multipart>=0.0.20",
  "neo4j>=5.27.0",
  "uvicorn>=0.42.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.2",
  "httpx>=0.28.1",
  "bandit>=1.8.3",
  "pip-audit>=2.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
